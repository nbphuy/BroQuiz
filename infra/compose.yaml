services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-broquiz}
      POSTGRES_USER: ${POSTGRES_USER:-broquiz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-broquiz_local_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - broquiz_pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  broquiz_pgdata:
